<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Relatório Financeiro</title>

    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
</head>
<body>

<div class="cadastro-container">

    <h1>Criar Conta</h1>

    <form th:action="@{/cadastro}" method="post">

        <input
                type="text"
                name="nome"
                placeholder="Nome completo"
                required>

        <input
                type="email"
                name="email"
                placeholder="E-mail"
                required>

        <input
                type="password"
                name="senha"
                placeholder="Senha"
                required>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <a th:href="@{/}">
        Já possui uma conta? Faça login
    </a>

</div>

</body>
</html>
